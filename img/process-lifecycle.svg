<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="'Segoe UI', Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00A859"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<rect x="60" y="6" width="220" height="36" rx="10" fill="#0F172A"/><text x="170" y="30" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">Valideyn (müdir) PID 100</text>
<rect x="620" y="6" width="220" height="36" rx="10" fill="#0F172A"/><text x="730" y="30" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">Uşaq (işçi) PID 101</text>
<line x1="170" y1="42" x2="170" y2="345" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="730" y1="64" x2="730" y2="345" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="170" y1="92" x2="730" y2="92" stroke="#0F172A" stroke-width="2.4" marker-end="url(#a)"/>
<text x="450" y="76" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">① fork()  — «özümün kopyasını yarat»</text>
<text x="450" y="114" text-anchor="middle" font-size="15" fill="#475569">uşaq yaranır, kodu valideynlə eynidir</text>
<text x="20" y="165" font-size="15" fill="#475569">valideyn öz işində davam edir</text>
<text x="880" y="150" text-anchor="end" font-size="16" font-weight="700" fill="#00703A">② exec("/bin/ls")</text>
<text x="880" y="170" text-anchor="end" font-size="15" fill="#00703A">kopya başqa proqrama çevrilir</text>
<text x="880" y="196" text-anchor="end" font-size="15" fill="#848688">... uşaq işləyir ...</text>
<line x1="730" y1="236" x2="170" y2="236" stroke="#DC2626" stroke-width="2.4" marker-end="url(#r)"/>
<text x="450" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#DC2626">③ exit(0)  — «işim bitdi, nəticə: 0»</text>
<text x="450" y="258" text-anchor="middle" font-size="15" fill="#DC2626">uşaq Zombie (Z) olur: yalnız PID + exit kodu qalır</text>
<text x="20" y="298" font-size="16" font-weight="700" fill="#00703A">④ wait()  → valideyn nəticəni oxuyur → PID azad olur ✔</text>
<text x="20" y="326" font-size="16" font-weight="700" fill="#DC2626">wait() çağırılmasa → Zombie PID-i tutmağa davam edir ⚠</text></svg>
