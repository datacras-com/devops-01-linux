<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 175" width="900" height="175" font-family="'Segoe UI', Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker></defs>
<rect x="2" y="8" width="205" height="84" rx="12" fill="#E8F5EE" stroke="#00A859" stroke-width="2.5"/>
<text x="104" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#00703A">① SIGTERM (15)</text>
<text x="104" y="58" text-anchor="middle" font-size="15" fill="#0F172A">«Zəhmət olmasa,</text><text x="104" y="77" text-anchor="middle" font-size="15" fill="#0F172A">özün bağlan»</text>
<line x1="207" y1="50" x2="235" y2="50" stroke="#0F172A" stroke-width="2.4" marker-end="url(#a)"/>
<rect x="237" y="8" width="205" height="84" rx="12" fill="#fff" stroke="#9CA3AF" stroke-width="2.5"/>
<text x="339" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">② Təmizlik</text>
<text x="339" y="56" text-anchor="middle" font-size="14" fill="#0F172A">bağlantıları bağlayır,</text><text x="339" y="74" text-anchor="middle" font-size="14" fill="#0F172A">datanı diskə yazır, lock silir</text>
<line x1="442" y1="50" x2="470" y2="50" stroke="#0F172A" stroke-width="2.4" marker-end="url(#a)"/>
<rect x="472" y="8" width="205" height="84" rx="12" fill="#fff" stroke="#9CA3AF" stroke-width="2.5"/>
<text x="574" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">③ Gözlə 10–30 san</text>
<text x="574" y="58" text-anchor="middle" font-size="14" fill="#0F172A">çıxdısa → bitdi ✔</text><text x="574" y="76" text-anchor="middle" font-size="14" fill="#DC2626">hələ işləyirsə ↓</text>
<line x1="677" y1="50" x2="705" y2="50" stroke="#DC2626" stroke-width="2.4" marker-end="url(#a)"/>
<rect x="707" y="8" width="191" height="84" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
<text x="802" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#DC2626">④ SIGKILL (9)</text>
<text x="802" y="58" text-anchor="middle" font-size="15" fill="#0F172A">«Dərhal öl» — kernel</text><text x="802" y="77" text-anchor="middle" font-size="15" fill="#0F172A">prosesi birbaşa silir</text>
<text x="339" y="120" text-anchor="middle" font-size="15" fill="#00703A" font-weight="700">proses öz qərarını verir (handler)</text>
<text x="802" y="120" text-anchor="middle" font-size="15" fill="#DC2626" font-weight="700">proses qarışa bilmir</text>
<text x="802" y="146" text-anchor="middle" font-size="15" fill="#DC2626">təmizlik YOXDUR ⚠</text>
<text x="450" y="168" text-anchor="middle" font-size="15" fill="#475569">Qayda: əvvəl nəzakətlə (TERM), yalnız cavab verməsə güclə (KILL)</text></svg>
