<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 215" width="900" height="215" font-family="'Segoe UI', Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00A859"/></marker></defs>
<rect x="6" y="20" width="224" height="120" rx="12" fill="#fff" stroke="#0F172A" stroke-width="2.5"/>
<text x="118" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">① Unit file (diskdə)</text>
<text x="118" y="75" text-anchor="middle" font-size="14" fill="#00703A">/etc/systemd/system/</text><text x="118" y="93" text-anchor="middle" font-size="14" fill="#00703A" font-weight="700">myapp.service</text>
<text x="118" y="118" text-anchor="middle" font-size="14" fill="#475569">adi mətn faylı (resept kartı)</text>
<line x1="232" y1="80" x2="336" y2="80" stroke="#00A859" stroke-width="3" marker-end="url(#a)"/>
<text x="284" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#00A859">daemon-reload</text>
<text x="284" y="104" text-anchor="middle" font-size="13" fill="#475569">«faylı oxu»</text>
<rect x="338" y="20" width="224" height="120" rx="12" fill="#E8F5EE" stroke="#00A859" stroke-width="2.5"/>
<text x="450" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="#00703A">② systemd yaddaşı</text>
<text x="450" y="75" text-anchor="middle" font-size="14" fill="#0F172A">myapp unit-ini tanıyır</text>
<text x="450" y="97" text-anchor="middle" font-size="14" fill="#0F172A">(aşpaz kartı oxuyub)</text>
<text x="450" y="121" text-anchor="middle" font-size="13" fill="#DC2626">reload olmasa: köhnə versiya</text>
<line x1="564" y1="80" x2="668" y2="80" stroke="#00A859" stroke-width="3" marker-end="url(#a)"/>
<text x="616" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#00A859">start</text>
<text x="616" y="104" text-anchor="middle" font-size="13" fill="#475569">«işə sal»</text>
<rect x="670" y="20" width="224" height="120" rx="12" fill="#fff" stroke="#0F172A" stroke-width="2.5"/>
<text x="782" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">③ İşləyən proses</text>
<text x="782" y="75" text-anchor="middle" font-size="14" fill="#0F172A">python3 (PID 812)</text>
<text x="782" y="97" text-anchor="middle" font-size="14" fill="#0F172A">(yemək bişir)</text>
<text x="782" y="121" text-anchor="middle" font-size="13" fill="#475569">çöksə systemd qaldırır</text>
<text x="450" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#DC2626">Faylı dəyişdin, daemon-reload etmədin → systemd hələ köhnə kartı bilir ⚠</text>
<text x="450" y="202" text-anchor="middle" font-size="14" fill="#475569">daemon-reload prosesi yenidən başlatmır, yalnız systemd-nin yaddaşını yeniləyir</text></svg>
