<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 215" width="900" height="215" font-family="'Segoe UI', Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker></defs>
<rect x="2" y="2" width="438" height="211" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
<text x="221" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#DC2626">Zombie: uşaq ölüb, valideyn bilmir</text>
<rect x="30" y="50" width="160" height="54" rx="10" fill="#fff" stroke="#0F172A" stroke-width="2"/>
<text x="110" y="73" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Valideyn</text><text x="110" y="93" text-anchor="middle" font-size="14" fill="#00703A">işləyir ✔</text>
<line x1="190" y1="77" x2="250" y2="77" stroke="#0F172A" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="252" y="50" width="160" height="54" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4"/>
<text x="332" y="73" text-anchor="middle" font-size="16" font-weight="700" fill="#DC2626">Uşaq (Z)</text><text x="332" y="93" text-anchor="middle" font-size="14" fill="#DC2626">ölüb ✖ amma siyahıda</text>
<text x="221" y="132" text-anchor="middle" font-size="15" fill="#0F172A">Valideyn <tspan font-weight="700">wait()</tspan> çağırmır → nəticəni oxumur</text>
<text x="221" y="156" text-anchor="middle" font-size="15" fill="#0F172A">Uşağın <tspan font-weight="700">PID-i</tspan> cədvəldə qalır</text>
<text x="221" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#DC2626">Bənzətmə: işçi gedib, hesabatı stolda qalıb</text>
<rect x="460" y="2" width="438" height="211" rx="14" fill="#F0FAF4" stroke="#00A859" stroke-width="2.5"/>
<text x="679" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#00703A">Orphan: valideyn gedib, uşaq işləyir</text>
<rect x="488" y="50" width="160" height="54" rx="10" fill="#fff" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 4"/>
<text x="568" y="73" text-anchor="middle" font-size="16" font-weight="700" fill="#848688">Valideyn</text><text x="568" y="93" text-anchor="middle" font-size="14" fill="#848688">bitdi ✖</text>
<rect x="710" y="50" width="160" height="54" rx="10" fill="#fff" stroke="#00A859" stroke-width="2"/>
<text x="790" y="73" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Uşaq</text><text x="790" y="93" text-anchor="middle" font-size="14" fill="#00703A">işləyir ✔</text>
<line x1="710" y1="77" x2="650" y2="77" stroke="#00A859" stroke-width="2.2" stroke-dasharray="5 4"/><text x="680" y="70" text-anchor="middle" font-size="13" fill="#848688">artıq yox</text>
<text x="679" y="132" text-anchor="middle" font-size="15" fill="#0F172A"><tspan font-weight="700">PID 1</tspan> (systemd) uşağı övladlığa götürür</text>
<text x="679" y="156" text-anchor="middle" font-size="15" fill="#0F172A">Uşaq normal davam edir, sonda PID 1 <tspan font-weight="700">wait()</tspan> edir</text>
<text x="679" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#00703A">Bənzətmə: müdir gedib, şirkət işçini saxlayıb</text></svg>
